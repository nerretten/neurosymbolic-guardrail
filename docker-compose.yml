version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: guardrail-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - 'NEO4J_PLUGINS=["apoc"]'
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
