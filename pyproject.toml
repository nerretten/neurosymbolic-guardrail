[project]
name = "neurosymbolic-guardrail"
version = "0.1.0"
description = ""
authors = [
    {name = "nerretten",email = "nerretten@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.0,<0.18.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
